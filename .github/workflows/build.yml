name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all export targets'
        type: boolean
        default: true
      create_release:
        description: 'Create a versioned release from this build'
        type: boolean
        default: false
      merge_request_id:
        description: 'Merge request ID (informational)'
        type: string
        default: ''
      merge_request_url:
        description: 'Merge request URL (informational)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Export game builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot headless
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo unzip -o /tmp/godot.zip -d /opt
          sudo ln -sf "/opt/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/tpl "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -o /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: godot --headless --import

      - name: Export builds
        run: |
          mkdir -p build/linux build/windows build/web
          godot --headless --export-release "Linux" build/linux/job-simulator-2.x86_64
          godot --headless --export-release "Windows" build/windows/job-simulator-2.exe
          godot --headless --export-release "Web" build/web/index.html

      - name: Package artifacts
        run: |
          set -e
          cd build
          tar -czf job-simulator-2-linux-x86_64.tar.gz -C linux .
          zip -qr job-simulator-2-linux-x86_64.zip linux
          zip -qr job-simulator-2-windows-x86_64.zip windows
          tar -czf job-simulator-2-windows-x86_64.tar.gz -C windows .
          zip -qr job-simulator-2-web.zip web
          tar -czf job-simulator-2-web.tar.gz -C web .
          cd ..
          git archive --format=zip --output=build/source.zip HEAD
          git archive --format=tar.gz --output=build/source.tar.gz HEAD
          cd build
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: game-builds
          path: |
            build/*.tar.gz
            build/*.zip
            build/SHA256SUMS.txt
          retention-days: 400

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          gh release create "${GITHUB_REF_NAME}" \
            --title "Job Simulator 2 ${GITHUB_REF_NAME}" \
            --notes "Job Simulator 2 ${GITHUB_REF_NAME}. Builds for Linux, Windows and Web." \
            *.tar.gz *.zip SHA256SUMS.txt
